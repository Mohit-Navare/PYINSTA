{% extends "base.html" %}
{% block title %}Forgot Password - PyInsta{% endblock %}

{% block content %}
<section class="auth-page auth-page-wide">
  <div class="auth-container">
    <h2>Forgot Password</h2>
    <p class="auth-subtitle">Verify your username and email, then choose a new password.</p>

    <form class="auth-form active" method="POST" action="{{ url_for('forgot_password') }}">
      <div class="input-wrap">
        <span class="input-icon">@</span>
        <input type="text" name="username" placeholder="Username" autocomplete="username" required>
      </div>
      <div class="input-wrap">
        <span class="input-icon">M</span>
        <input type="email" name="email" placeholder="Email" autocomplete="email" required>
      </div>
      <div class="input-wrap">
        <span class="input-icon">#</span>
        <input type="password" name="new_password" placeholder="New password" autocomplete="new-password" required minlength="6">
      </div>
      <div class="input-wrap">
        <span class="input-icon">#</span>
        <input type="password" name="confirm_password" placeholder="Confirm new password" autocomplete="new-password" required minlength="6">
      </div>
      <button type="submit" class="auth-submit-animated">Reset Password</button>
    </form>

    <div class="auth-links auth-links-split">
      <a href="{{ url_for('login') }}">Back to login</a>
      <a href="{{ url_for('register') }}">Create account</a>
    </div>
  </div>
</section>
{% endblock %}
